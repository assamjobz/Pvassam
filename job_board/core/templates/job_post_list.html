{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">All Job Posts</h1>
<div class="row">
    {% for job in jobs %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ job.title }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ job.organization.name }}</h6>
                    <p class="card-text"><small class="text-muted">{{ job.location }}</small></p>
                    <p class="card-text">{{ job.description|truncatewords:20 }}</p>
                    <a href="{% url 'job_post_detail' job.pk %}" class="btn btn-primary mt-auto">View Details</a>
                </div>
            </div>
        </div>
    {% empty %}
        <div class="col">
            <p>There are no jobs posted at the moment.</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
