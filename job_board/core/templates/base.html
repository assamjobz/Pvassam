<!DOCTYPE html>
<html>
<head>
    <title>Job Board</title>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        {% if user.is_authenticated %}
            <p>Hi {{ user.email }}!</p>
            {% if user.user_type == 'organization' and user.organization.is_verified %}
                <a href="{% url 'organization_jobs' %}">My Job Posts</a>
            {% endif %}
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'jobseeker_signup' %}">Sign up as Job Seeker</a>
            <a href="{% url 'organization_signup' %}">Sign up as Organization</a>
        {% endif %}
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
